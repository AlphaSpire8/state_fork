# This is a template used in the application to generating the config file for
# training tasks
defaults:
  - data: perturbation
  - model: state
  - training: default
  - wandb: default
  - _self_
  

# output_dir must be an absolute path (so that launch scripts are fully descriptive)
name: run1
output_dir: /data1/fanpeishan/TheraShift/runs
use_wandb: false
overwrite: false
# return_adatas: false
# pred_adata_path: null
# true_adata_path: null

# don't save hydra output
hydra:
  output_subdir: /data1/fanpeishan/TheraShift/runs/hydra
  run:
    dir: .
  job_logging:
    formatters:
      simple:
        format: "[%(levelname)s] %(message)s"  # Simple format for logging
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        level: INFO
        stream: ext://sys.stdout
    root:
      level: INFO
    loggers:
      __main__:
        level: DEBUG
        handlers: [console]
        propagate: false
