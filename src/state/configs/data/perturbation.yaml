name: PerturbationDataModule
kwargs:
  is_log1p: true
  toml_config_path: null
  embed_key: SE
  output_space: all
  pert_rep: onehot
  basal_rep: sample
  num_workers: 36
  pin_memory: true
  n_basal_samples: 1
  downsample: null
  downsample_cells: null
  additional_obs: []
  basal_mapping_strategy: random
  should_yield_control_cells: true
  batch_col: batch_id
  pert_col: condition
  cell_type_key: cell_type
  control_pert: "[('DMSO_TF', 0.0, 'uM')]"
  map_controls: true # for a control cell, should we use it as the target (learn identity) or sample a control?
  perturbation_features_file: null
  store_raw_basal: false
  int_counts: false
  barcode: true
  use_consecutive_loading: false
  val_subsample_fraction: 1.0
# output_dir: null
# debug: true
